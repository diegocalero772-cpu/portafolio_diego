# Este workflow muestra un mensaje
name: Hola Mundo

# Eventos que ejecutan el workflow
on:
  push:
  pull_request:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  saludo:
    # Máquina virtual Ubuntu de GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Mostrar mensaje
        run: echo "Hola Mundo"
